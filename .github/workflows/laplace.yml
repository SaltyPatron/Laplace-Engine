# Build the Engine with its native dependency and verify artifact/admission boundaries.
# The runner declaration supplies dependencies and independently installed perf-caches.
name: Laplace-Engine
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  # Every night main's parity runs whatever changed: what the monorepo's CLI and Laplace-Native do moves the comparison
  # too, and neither is a path here.
  schedule:
    - cron: "17 9 * * *"
permissions:
  contents: read
  pull-requests: read
# A pull request's newer push supersedes its older run, which then holds the one runner for nothing. A push to main is
# its own group, so every merge still builds and dispatches its deployment.
concurrency:
  group: laplace-engine-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  engine:
    runs-on: [self-hosted, laplace, Laplace-Engine]
    outputs:
      parity: ${{ steps.changes.outputs.parity }}
    steps:
      - name: Select this run's canonical cache closure
        run: |
          echo "LAPLACE_TIER0=$RUNNER_TEMP/engine/inputs/tier0.bin" >> "$GITHUB_ENV"
          echo "LAPLACE_FLAGS=$RUNNER_TEMP/engine/inputs/tier0.flags" >> "$GITHUB_ENV"
          echo "LAPLACE_HIGHWAY=$RUNNER_TEMP/engine/inputs/highway.bin" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { path: Laplace-Engine }
      # Whether this change can move what an ingest records (tools/ci/parity-needed.sh says which paths can); the parity
      # job runs only then. A change that cannot be listed runs it.
      - name: changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename') || files='*' ;;
            push) if [[ -z $BEFORE || $BEFORE =~ ^0+$ ]]; then files='*'
                  else files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq 'if (.files | length) >= 300 then "*" else .files[].filename end') || files='*'; fi ;;
            *) files='*' ;;
          esac
          parity=$(printf '%s\n' "$files" | bash Laplace-Engine/tools/ci/parity-needed.sh)
          echo "parity=$parity" >> "$GITHUB_OUTPUT"
          echo "parity: $parity ($EVENT)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Native", path: Laplace-Native, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Operations", path: Laplace-Operations, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      # Every job runs the binary its own run built (tests/ci-own-binary.py): the build directory is the runner's, shared
      # by every run, so a job after this one reads the binary this job hands over, never the directory.
      - name: workflow contract
        run: python3 Laplace-Engine/tests/ci-own-binary.py Laplace-Engine/.github/workflows/laplace.yml
      - name: build
        run: |
          . /opt/intel/oneapi/setvars.sh >/dev/null 2>&1 || true
          export LAPLACE_SRC=$GITHUB_WORKSPACE LAPLACE_NATIVE=$GITHUB_WORKSPACE/Laplace-Native OMP_NUM_THREADS=$(nproc) MKL_NUM_THREADS=$(nproc)
          cmake -S Laplace-Engine -B "$LAPLACE_BUILD/Laplace-Engine/icx-release" -G Ninja -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build "$LAPLACE_BUILD/Laplace-Engine/icx-release"
          mkdir -p "$RUNNER_TEMP/engine" && cp "$LAPLACE_BUILD/Laplace-Engine/icx-release/laplace" "$RUNNER_TEMP/engine/laplace"
          sha256sum "$RUNNER_TEMP/engine/laplace" | tee "$RUNNER_TEMP/engine/laplace.sha256"
      - name: Provide the pinned Rust compiler for the Tree-sitter generator
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.90.0

      - name: Compile the recipe grammars from this revision
        run: |
          . /opt/intel/oneapi/setvars.sh >/dev/null 2>&1 || true
          bash Laplace-Engine/tools/build_grammars.sh Laplace-Engine/recipes/formats/grammars "$LAPLACE_GRAMMARS"
      - name: Prepare canonical caches for this run from local Unicode and frozen manifests
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$LAPLACE_TIER0")"
          ucd="${LAPLACE_UCD:-/vault/Data/UCD}/Public/UCD/latest"
          "$RUNNER_TEMP/engine/laplace" tier0 -u "$ucd" -o "$LAPLACE_TIER0"
          "$RUNNER_TEMP/engine/laplace" flags -u "$ucd" -o "$LAPLACE_FLAGS"
          LAPLACE_MANIFEST="$GITHUB_WORKSPACE/Laplace-Native/manifest" "$RUNNER_TEMP/engine/laplace" highway -o "$LAPLACE_HIGHWAY"
      # The run's binary, for its plan and parity jobs: a later run's build cannot replace it (one name per run; a job run
      # again replaces it with its own build).
      - uses: actions/upload-artifact@v4
        with: { name: laplace-engine, path: "${{ runner.temp }}/engine/", retention-days: 1, overwrite: true, if-no-files-found: error }
      - name: checks
        run: |
          L=$RUNNER_TEMP/engine/laplace
          export LAPLACE_HIGHWAY=${LAPLACE_HIGHWAY:-${LAPLACE_TIER0%.bin}.highway}
          export TMPDIR=${RUNNER_TEMP:?}
          export LAPLACE_RECIPES=$GITHUB_WORKSPACE/Laplace-Engine/recipes
          failed=0
          for suite in highway-admission layout-counted left-open wordnet-recipes claims-tsv thing-resolved data-root source-after workspace-code; do
            if ! bash "Laplace-Engine/tests/$suite.sh" "$L"; then
              echo "::error::Engine check failed: $suite"
              failed=1
            fi
          done
          for suite in test_diff test_claims; do
            if ! python3 "Laplace-Engine/tools/parity/$suite.py"; then
              echo "::error::Engine check failed: $suite"
              failed=1
            fi
          done
          if ! bash Laplace-Engine/tests/parity-needed.sh; then
            echo "::error::Engine check failed: parity-needed"
            failed=1
          fi
          exit "$failed"
      - name: Verify ingestion staging under a scoped database identity
        run: |
          . Laplace-Operations/laplace.env
          export LAPLACE_NATIVE=$GITHUB_WORKSPACE/Laplace-Native
          python3 Laplace-Engine/tests/staging-role.py "$RUNNER_TEMP/engine/laplace"
      - name: a working tree's whole reading supersedes the readings before it
        run: |
          . Laplace-Operations/laplace.env
          export TMPDIR=${RUNNER_TEMP:?} LAPLACE_HIGHWAY=${LAPLACE_HIGHWAY:-${LAPLACE_TIER0%.bin}.highway} PSQL=$(dirname "$PG_CONFIG")/psql
          bash Laplace-Engine/tests/supersede.sh "$LAPLACE_BUILD/Laplace-Engine/icx-release/laplace"
      - name: translate goes through the lexicalization, read from the recipe (dog en en, dog en fr)
        run: |
          . Laplace-Operations/laplace.env
          export TMPDIR=${RUNNER_TEMP:?} LAPLACE_HIGHWAY=${LAPLACE_HIGHWAY:-${LAPLACE_TIER0%.bin}.highway} PSQL=$(dirname "$PG_CONFIG")/psql
          LAPLACE_RECIPES=$GITHUB_WORKSPACE/Laplace-Engine/recipes bash Laplace-Engine/tests/translate.sh "$LAPLACE_BUILD/Laplace-Engine/icx-release/laplace"
  # Every source in recipes/order is where its recipe says, on the data host (Laplace-Engine#60): the plan walks each
  # source's root and matches its files to recipes, without the database, and fails on a source whose root is unset, at
  # none of its roots or holding no files. Its own job: what it finds is the data's, and does not hold the deploy.
  plan:
    needs: engine
    runs-on: [self-hosted, laplace, Laplace-Engine]
    steps:
      - name: Select this run's canonical cache closure
        run: |
          echo "LAPLACE_TIER0=$RUNNER_TEMP/engine/inputs/tier0.bin" >> "$GITHUB_ENV"
          echo "LAPLACE_FLAGS=$RUNNER_TEMP/engine/inputs/tier0.flags" >> "$GITHUB_ENV"
          echo "LAPLACE_HIGHWAY=$RUNNER_TEMP/engine/inputs/highway.bin" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { path: Laplace-Engine }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Operations", path: Laplace-Operations, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - uses: actions/download-artifact@v4
        with: { name: laplace-engine, path: "${{ runner.temp }}/engine" }
      - name: the run's own binary
        run: chmod +x "$RUNNER_TEMP/engine/laplace" && (cd "$RUNNER_TEMP/engine" && sed "s#  .*#  laplace#" laplace.sha256 | sha256sum -c -)
      - name: ingest --plan, every source
        shell: bash
        run: |
          . Laplace-Operations/laplace.env
          export LAPLACE_RECIPES=$GITHUB_WORKSPACE/Laplace-Engine/recipes LAPLACE_WORK=${RUNNER_TEMP:?}
          export LAPLACE_HIGHWAY=${LAPLACE_HIGHWAY:-${LAPLACE_TIER0%.bin}.highway}
          "$RUNNER_TEMP/engine/laplace" ingest --plan | tee -a "$GITHUB_STEP_SUMMARY"
  # The parity harness (Laplace#1885 step 1): iso-639 ingested by the monorepo's published CLI and by this build, each
  # into a scratch database (laplace_parity_*, dropped after), and what each recorded compared. Its differences are
  # findings, written to the job summary; the job fails only when the harness cannot run. Its own job, as plan is.
  # It runs when the change can move what an ingest records (the engine job's changes step), every night, and on a
  # dispatch; after plan, so the short job does not wait out the long one on the one runner.
  parity:
    needs: [engine, plan]
    if: ${{ !cancelled() && needs.engine.result == 'success' && needs.engine.outputs.parity == 'true' }}
    runs-on: [self-hosted, laplace, Laplace-Engine]
    steps:
      - name: Select this run's canonical cache closure
        run: |
          echo "LAPLACE_TIER0=$RUNNER_TEMP/engine/inputs/tier0.bin" >> "$GITHUB_ENV"
          echo "LAPLACE_FLAGS=$RUNNER_TEMP/engine/inputs/tier0.flags" >> "$GITHUB_ENV"
          echo "LAPLACE_HIGHWAY=$RUNNER_TEMP/engine/inputs/highway.bin" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { path: Laplace-Engine }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Operations", path: Laplace-Operations, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - uses: actions/download-artifact@v4
        with: { name: laplace-engine, path: "${{ runner.temp }}/engine" }
      - name: the run's own binary
        run: chmod +x "$RUNNER_TEMP/engine/laplace" && (cd "$RUNNER_TEMP/engine" && sed "s#  .*#  laplace#" laplace.sha256 | sha256sum -c -)
      - name: iso-639, laplace-mono against the Engine
        shell: bash
        run: |
          . Laplace-Operations/laplace.env
          export LAPLACE_RECIPES=$GITHUB_WORKSPACE/Laplace-Engine/recipes LAPLACE_WORK=${RUNNER_TEMP:?}/work TMPDIR=${RUNNER_TEMP:?}
          export LAPLACE_HIGHWAY=${LAPLACE_HIGHWAY:-${LAPLACE_TIER0%.bin}.highway}
          export LAPLACE_ENGINE_BIN=$RUNNER_TEMP/engine/laplace PSQL=$(dirname "$PG_CONFIG")/psql
          mkdir -p "$LAPLACE_WORK"
          rc=0; bash Laplace-Engine/tools/parity/parity.sh --out "$RUNNER_TEMP/parity" --after unicode=unicode iso-639=iso639 || rc=$?
          [[ -f "$RUNNER_TEMP/parity/report.md" ]] && cat "$RUNNER_TEMP/parity/report.md" >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: parity-iso-639, path: "${{ runner.temp }}/parity/*.md\n${{ runner.temp }}/parity/*.json\n${{ runner.temp }}/parity/logs\n${{ runner.temp }}/parity/*/*/replay.log", if-no-files-found: ignore }
  # Every merge to main that passes deploys hart-server: Laplace-Operations' deployment runs with every repository at its
  # main (its laplace.yml, on a repository_dispatch main-merged; the token is the secret LAPLACE_CHECKOUT, agents.sh's).
  deploy:
    needs: engine
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, laplace, Laplace-Engine]
    steps:
      - name: hart-server deploys main (Laplace-Operations)
        env:
          TOKEN: ${{ secrets.LAPLACE_CHECKOUT }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository_owner }}/Laplace-Operations/dispatches" -d '{"event_type": "main-merged", "client_payload": {"repository": "${{ github.repository }}", "sha": "${{ github.sha }}"}}'
          echo "dispatched: Laplace-Operations deploys hart-server with ${{ github.repository }} at ${{ github.sha }}" | tee -a "$GITHUB_STEP_SUMMARY"
