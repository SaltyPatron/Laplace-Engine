# Build the Engine with its native dependency and verify artifact/admission boundaries.
# The runner declaration supplies dependencies and independently installed perf-caches.
name: Laplace-Engine
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  engine:
    runs-on: [self-hosted, laplace, Laplace-Engine]
    steps:
      - uses: actions/checkout@v4
        with: { path: Laplace-Engine }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Native", path: Laplace-Native, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Operations", path: Laplace-Operations, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - name: build
        run: |
          . /opt/intel/oneapi/setvars.sh >/dev/null 2>&1 || true
          export LAPLACE_SRC=$GITHUB_WORKSPACE LAPLACE_NATIVE=$GITHUB_WORKSPACE/Laplace-Native OMP_NUM_THREADS=$(nproc) MKL_NUM_THREADS=$(nproc)
          cmake -S Laplace-Engine -B "$LAPLACE_BUILD/Laplace-Engine/icx-release" -G Ninja -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build "$LAPLACE_BUILD/Laplace-Engine/icx-release"
      - name: checks
        run: |
          L=$LAPLACE_BUILD/Laplace-Engine/icx-release/laplace
          export LAPLACE_HIGHWAY=${LAPLACE_HIGHWAY:-${LAPLACE_TIER0%.bin}.highway}
          export TMPDIR=${RUNNER_TEMP:?}
          bash Laplace-Engine/tests/highway-admission.sh "$L"
          bash Laplace-Engine/tests/layout-counted.sh "$L"
          LAPLACE_RECIPES=$GITHUB_WORKSPACE/Laplace-Engine/recipes bash Laplace-Engine/tests/claims-tsv.sh "$L"
          LAPLACE_RECIPES=$GITHUB_WORKSPACE/Laplace-Engine/recipes bash Laplace-Engine/tests/data-root.sh "$L"
          LAPLACE_RECIPES=$GITHUB_WORKSPACE/Laplace-Engine/recipes bash Laplace-Engine/tests/workspace-code.sh "$L"
          python3 Laplace-Engine/tools/parity/test_diff.py
      - name: Verify ingestion staging under a scoped database identity
        run: |
          . Laplace-Operations/laplace.env
          export LAPLACE_NATIVE=$GITHUB_WORKSPACE/Laplace-Native
          python3 Laplace-Engine/tests/staging-role.py
      - name: translate goes through the lexicalization, read from the recipe (dog en en, dog en fr)
        run: |
          . Laplace-Operations/laplace.env
          export TMPDIR=${RUNNER_TEMP:?} LAPLACE_HIGHWAY=${LAPLACE_HIGHWAY:-${LAPLACE_TIER0%.bin}.highway} PSQL=$(dirname "$PG_CONFIG")/psql
          LAPLACE_RECIPES=$GITHUB_WORKSPACE/Laplace-Engine/recipes bash Laplace-Engine/tests/translate.sh "$LAPLACE_BUILD/Laplace-Engine/icx-release/laplace"
  # Every source in recipes/order is where its recipe says, on the data host (Laplace-Engine#60): the plan walks each
  # source's root and matches its files to recipes, without the database, and fails on a source whose root is unset, at
  # none of its roots or holding no files. Its own job: what it finds is the data's, and does not hold the deploy.
  plan:
    needs: engine
    runs-on: [self-hosted, laplace, Laplace-Engine]
    steps:
      - uses: actions/checkout@v4
        with: { path: Laplace-Engine }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Operations", path: Laplace-Operations, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - name: ingest --plan, every source
        shell: bash
        run: |
          . Laplace-Operations/laplace.env
          export LAPLACE_RECIPES=$GITHUB_WORKSPACE/Laplace-Engine/recipes LAPLACE_WORK=${RUNNER_TEMP:?}
          export LAPLACE_HIGHWAY=${LAPLACE_HIGHWAY:-${LAPLACE_TIER0%.bin}.highway}
          "$LAPLACE_BUILD/Laplace-Engine/icx-release/laplace" ingest --plan | tee -a "$GITHUB_STEP_SUMMARY"
  # The parity harness (Laplace#1885 step 1): iso-639 ingested by the monorepo's published CLI and by this build, each
  # into a scratch database (laplace_parity_*, dropped after), and what each recorded compared. Its differences are
  # findings, written to the job summary; the job fails only when the harness cannot run. Its own job, as plan is.
  parity:
    needs: engine
    runs-on: [self-hosted, laplace, Laplace-Engine]
    steps:
      - uses: actions/checkout@v4
        with: { path: Laplace-Engine }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Operations", path: Laplace-Operations, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - name: iso-639, laplace-mono against the Engine
        shell: bash
        run: |
          . Laplace-Operations/laplace.env
          export LAPLACE_RECIPES=$GITHUB_WORKSPACE/Laplace-Engine/recipes LAPLACE_WORK=${RUNNER_TEMP:?}/work TMPDIR=${RUNNER_TEMP:?}
          export LAPLACE_HIGHWAY=${LAPLACE_HIGHWAY:-${LAPLACE_TIER0%.bin}.highway}
          export LAPLACE_ENGINE_BIN=$LAPLACE_BUILD/Laplace-Engine/icx-release/laplace PSQL=$(dirname "$PG_CONFIG")/psql
          mkdir -p "$LAPLACE_WORK"
          rc=0; bash Laplace-Engine/tools/parity/parity.sh --out "$RUNNER_TEMP/parity" --after unicode=unicode iso-639=iso639 || rc=$?
          [[ -f "$RUNNER_TEMP/parity/report.md" ]] && cat "$RUNNER_TEMP/parity/report.md" >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: parity-iso-639, path: "${{ runner.temp }}/parity/*.md\n${{ runner.temp }}/parity/*.json\n${{ runner.temp }}/parity/logs\n${{ runner.temp }}/parity/*/*/replay.log", if-no-files-found: ignore }
  # Every merge to main that passes deploys hart-server: Laplace-Operations' deployment runs with every repository at its
  # main (its laplace.yml, on a repository_dispatch main-merged; the token is the secret LAPLACE_CHECKOUT, agents.sh's).
  deploy:
    needs: engine
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, laplace, Laplace-Engine]
    steps:
      - name: hart-server deploys main (Laplace-Operations)
        env:
          TOKEN: ${{ secrets.LAPLACE_CHECKOUT }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository_owner }}/Laplace-Operations/dispatches" -d '{"event_type": "main-merged", "client_payload": {"repository": "${{ github.repository }}", "sha": "${{ github.sha }}"}}'
          echo "dispatched: Laplace-Operations deploys hart-server with ${{ github.repository }} at ${{ github.sha }}" | tee -a "$GITHUB_STEP_SUMMARY"
