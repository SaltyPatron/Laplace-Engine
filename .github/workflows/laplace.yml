# Build the Engine with its native dependency and verify artifact/admission boundaries, with no database: no check here
# starts a server, makes a database or connects to one. The Engine's database checks (tests/deployed/) run after
# Laplace-Operations has deployed a merge to main, against the deployed database through the deployed program
# (Laplace-Operations laplace.yml, job tests). The runner declaration supplies dependencies and installed perf-caches.
name: Laplace-Engine
on:
  workflow_dispatch:
    inputs:
      verify_estate:
        description: "Audit every installed corpus: each source's files matched to its recipes (ingest --plan)"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read
# Qualify the latest branch/PR head; superseded pushes must not queue obsolete
# native builds. Explicit operator qualification owns an independent run.
concurrency:
  group: laplace-engine-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  engine:
    runs-on: [self-hosted, laplace, Laplace-Engine]
    timeout-minutes: 150
    outputs:
      deploys: ${{ steps.changes.outputs.deploys }}
    steps:
      - name: Select this run's canonical cache closure
        run: |
          echo "LAPLACE_PREPARED_GRAMMARS=${LAPLACE_GRAMMARS:?prepared grammars must be declared}" >> "$GITHUB_ENV"
          echo "LAPLACE_TIER0=$RUNNER_TEMP/engine/inputs/tier0.bin" >> "$GITHUB_ENV"
          echo "LAPLACE_FLAGS=$RUNNER_TEMP/engine/inputs/tier0.flags" >> "$GITHUB_ENV"
          echo "LAPLACE_HIGHWAY=$RUNNER_TEMP/engine/inputs/highway.bin" >> "$GITHUB_ENV"
          echo "LAPLACE_GRAMMARS=$RUNNER_TEMP/engine/inputs/grammars" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { path: Laplace-Engine }
      # Whether this change, merged, is deployed (tools/ci/deploy-needed.sh says which paths can move the deployed system or
      # its database checks); the deploy job dispatches only then. A change that cannot be listed deploys.
      - name: changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename') || files='*' ;;
            push) if [[ -z $BEFORE || $BEFORE =~ ^0+$ ]]; then files='*'
                  else files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq 'if (.files | length) >= 300 then "*" else .files[].filename end') || files='*'; fi ;;
            *) files='*' ;;
          esac
          deploys=$(printf '%s\n' "$files" | bash Laplace-Engine/tools/ci/deploy-needed.sh)
          echo "deploys=$deploys" >> "$GITHUB_OUTPUT"
          echo "deploys: $deploys ($EVENT)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Native", ref: main, path: Laplace-Native, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Operations", path: Laplace-Operations, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - name: Select qualified Native inputs for the exact source revision
        env:
          GH_TOKEN: ${{ secrets.LAPLACE_CHECKOUT }}
        run: bash Laplace-Operations/native-inputs.sh prepare "$GITHUB_WORKSPACE/Laplace-Native"
      - name: Verify Native source selection across reconfiguration
        run: cmake "-DSOURCE=$GITHUB_WORKSPACE/Laplace-Engine" "-DWORK=$RUNNER_TEMP/native-source-defaults" -P Laplace-Engine/tests/native-source-defaults.cmake
      - name: build
        run: |
          . /opt/intel/oneapi/setvars.sh >/dev/null 2>&1 || true
          export LAPLACE_SRC=$GITHUB_WORKSPACE LAPLACE_NATIVE=$GITHUB_WORKSPACE/Laplace-Native OMP_NUM_THREADS=$(nproc) MKL_NUM_THREADS=$(nproc)
          cmake -S Laplace-Engine -B "$LAPLACE_BUILD/Laplace-Engine/icx-release" -G Ninja -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLAPLACE_TIER0:FILEPATH="$LAPLACE_TIER0" -DLAPLACE_NATIVE:PATH="$LAPLACE_NATIVE" -DLAPLACE_OPERATIONS:PATH="$GITHUB_WORKSPACE/Laplace-Operations"
          cmake --build "$LAPLACE_BUILD/Laplace-Engine/icx-release"
          cmake --build "$LAPLACE_BUILD/Laplace-Engine/icx-release" --target reader_depth claim_decode input_frame_test chess_positions
          mkdir -p "$RUNNER_TEMP/engine" && cp "$LAPLACE_BUILD/Laplace-Engine/icx-release/laplace" "$RUNNER_TEMP/engine/laplace"
          cp "$LAPLACE_BUILD/Laplace-Engine/icx-release/reader_depth" "$RUNNER_TEMP/engine/reader-depth"
          cp "$LAPLACE_BUILD/Laplace-Engine/icx-release/claim_decode" "$RUNNER_TEMP/engine/claim-decode"
          cp "$LAPLACE_BUILD/Laplace-Engine/icx-release/input_frame_test" "$RUNNER_TEMP/engine/input-frame"
          cp "$LAPLACE_BUILD/Laplace-Engine/icx-release/chess_positions" "$RUNNER_TEMP/engine/chess-positions"
          sha256sum "$RUNNER_TEMP/engine/laplace" | tee "$RUNNER_TEMP/engine/laplace.sha256"
      - name: Provide the pinned Rust compiler for the Tree-sitter generator
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.90.0

      - name: Compile the recipe grammars from this revision
        run: |
          . Laplace-Operations/laplace.env
          . /opt/intel/oneapi/setvars.sh >/dev/null 2>&1 || true
          export LAPLACE_OPERATIONS="$GITHUB_WORKSPACE/Laplace-Operations"
          compiled_grammars="$LAPLACE_BUILD/Laplace-Engine/grammars"
          bash Laplace-Engine/tools/build_grammars.sh Laplace-Engine/recipes/formats/grammars "$compiled_grammars"
          python3 Laplace-Operations/installation/artifact_store.py --prepared "$LAPLACE_PREPARED_GRAMMARS" --compiled "$compiled_grammars" --output "$LAPLACE_GRAMMARS"
          python3 Laplace-Engine/tests/grammar-build-cache.py
          python3 Laplace-Engine/tests/runtime-resources.py
      - name: Stage the qualified Native closure with this run's candidate
        run: |
          mkdir -p "$RUNNER_TEMP/engine/inputs"
          cp -a --reflink=auto --no-preserve=ownership "$LAPLACE_TIER0" "$RUNNER_TEMP/engine/inputs/tier0.bin"
          cp -a --reflink=auto --no-preserve=ownership "$LAPLACE_FLAGS" "$RUNNER_TEMP/engine/inputs/tier0.flags"
          cp -a --reflink=auto --no-preserve=ownership "${LAPLACE_FLAGS}.layout" "$RUNNER_TEMP/engine/inputs/tier0.flags.layout"
          cp -a --reflink=auto --no-preserve=ownership "$LAPLACE_HIGHWAY" "$RUNNER_TEMP/engine/inputs/highway.bin"
      # The run's binary, for its plan job: a later run's build cannot replace it (one name per run; a job run
      # again replaces it with its own build).
      - uses: actions/upload-artifact@v4
        with: { name: laplace-engine, path: "${{ runner.temp }}/engine/", retention-days: 1, overwrite: true, if-no-files-found: error }
      - name: checks
        run: |
          L=$RUNNER_TEMP/engine/laplace
          "$RUNNER_TEMP/engine/claim-decode"
          "$RUNNER_TEMP/engine/input-frame"
          export LAPLACE_HIGHWAY=${LAPLACE_HIGHWAY:-${LAPLACE_TIER0%.bin}.highway}
          export TMPDIR=${RUNNER_TEMP:?}
          export LAPLACE_RECIPES=$GITHUB_WORKSPACE/Laplace-Engine/recipes
          python3 Laplace-Engine/tests/catalog.py "$L"
          python3 Laplace-Engine/tests/utf8-input.py "$L" "$RUNNER_TEMP/engine/reader-depth"
          python3 Laplace-Engine/tests/tree-occurrences.py "$L"
          python3 Laplace-Engine/tests/prompt-occurrences.py "$L"
          python3 Laplace-Engine/tests/firmware-relations.py "$L"
          # the tablebase source's own tables, 3, 4 and 5 pieces, probed with a bounded cache (the host declares where its data is)
          bash Laplace-Engine/tests/syzygy-pieces.sh "$L" "${LAPLACE_DATA:-$(. /etc/laplace/machine.env && echo "$LAPLACE_DATA")}/Games/Chess/syzygy/3-4-5"
          python3 Laplace-Engine/tests/recipe-order.py "$L"
          python3 Laplace-Engine/tests/record-values-width.py "$L"
          python3 Laplace-Engine/tests/semantic-interpretation.py "$L"
          cmake -DWORK="$RUNNER_TEMP/reader-contract" -P Laplace-Engine/tests/reader-contract.cmake
          failed=0
          for suite in highway-admission layout-counted left-open wordnet-recipes claims-tsv thing-resolved data-root source-after workspace-code record-framing input-frame rich-text chess-identity chess-cache opening-lines syzygy-tablebase statement-claims cili-versions record-thing framenet-differences; do
            if ! bash "Laplace-Engine/tests/$suite.sh" "$L"; then
              echo "::error::Engine check failed: $suite"
              failed=1
            fi
          done
          if ! bash Laplace-Engine/tests/deploy-needed.sh; then
            echo "::error::Engine check failed: deploy-needed"
            failed=1
          fi
          # The database checks run after deployment (Laplace-Operations); here they must at least compile.
          for check in Laplace-Engine/tests/deployed/*.py; do
            python3 -m py_compile "$check" || { echo "::error::Engine database check does not compile: $check"; failed=1; }
          done
          bash -n Laplace-Engine/tests/deployed/run.sh || { echo "::error::Engine database check runner does not parse"; failed=1; }
          exit "$failed"
  # Every source in recipes/order is where its recipe says, on the data host (Laplace-Engine#60): the plan walks each
  # source's root and matches its files to recipes, without the database, and fails on a source whose root is unset, at
  # none of its roots or holding no files. Its own job: what it finds is the data's, and does not hold the deploy.
  plan:
    # Corpus availability is an estate audit, not a software build requirement.
    if: github.event_name == 'workflow_dispatch' && inputs.verify_estate
    needs: engine
    runs-on: [self-hosted, laplace, Laplace-Engine]
    timeout-minutes: 60
    steps:
      - name: Select this run's canonical cache closure
        run: |
          echo "LAPLACE_TIER0=$RUNNER_TEMP/engine/inputs/tier0.bin" >> "$GITHUB_ENV"
          echo "LAPLACE_FLAGS=$RUNNER_TEMP/engine/inputs/tier0.flags" >> "$GITHUB_ENV"
          echo "LAPLACE_HIGHWAY=$RUNNER_TEMP/engine/inputs/highway.bin" >> "$GITHUB_ENV"
          echo "LAPLACE_GRAMMARS=$RUNNER_TEMP/engine/inputs/grammars" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { path: Laplace-Engine }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/Laplace-Operations", path: Laplace-Operations, token: "${{ secrets.LAPLACE_CHECKOUT }}" }
      - uses: actions/download-artifact@v4
        with: { name: laplace-engine, path: "${{ runner.temp }}/engine" }
      - name: the run's own binary
        run: chmod +x "$RUNNER_TEMP/engine/laplace" && (cd "$RUNNER_TEMP/engine" && sed "s#  .*#  laplace#" laplace.sha256 | sha256sum -c -)
      - name: ingest --plan, every source
        shell: bash
        run: |
          . Laplace-Operations/laplace.env
          export LAPLACE_RECIPES=$GITHUB_WORKSPACE/Laplace-Engine/recipes LAPLACE_WORK=${RUNNER_TEMP:?}
          export LAPLACE_HIGHWAY=${LAPLACE_HIGHWAY:-${LAPLACE_TIER0%.bin}.highway}
          "$RUNNER_TEMP/engine/laplace" ingest --plan | tee -a "$GITHUB_STEP_SUMMARY"
  # Every merge to main that passes and can move the deployment deploys hart-server: Laplace-Operations' deployment runs
  # with this commit (its laplace.yml, on a repository_dispatch main-merged; the token is the secret LAPLACE_CHECKOUT,
  # agents.sh's), and its job tests runs this commit's database checks (tests/deployed/) against what it deployed.
  deploy:
    needs: engine
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.engine.outputs.deploys == 'true'
    runs-on: [self-hosted, laplace, Laplace-Engine]
    timeout-minutes: 10
    steps:
      - name: hart-server deploys main (Laplace-Operations)
        env:
          TOKEN: ${{ secrets.LAPLACE_CHECKOUT }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository_owner }}/Laplace-Operations/dispatches" -d '{"event_type": "main-merged", "client_payload": {"repository": "${{ github.repository }}", "sha": "${{ github.sha }}"}}'
          echo "dispatched: Laplace-Operations deploys hart-server with ${{ github.repository }} at ${{ github.sha }}" | tee -a "$GITHUB_STEP_SUMMARY"
